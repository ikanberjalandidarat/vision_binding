   <g id="text_1">
    <text style="fill: #152a40; font: 700 25px 'DejaVu Sans'; text-anchor: start" x="40.32" y="41.676094" transform="rotate(-0 40.32 41.676094)">Does frozen V-JEPA contain an accessible spatial geometry?</text>
   </g>
   <g id="text_2">
    <text style="fill: #53677a; font: 14px 'DejaVu Sans'; text-anchor: start" x="40.32" y="66.365812" transform="rotate(-0 40.32 66.365812)">Within-world probing  •  Same cached features and route splits for every method</text>
   </g>
   <g id="text_3">
    <text style="fill: #152a40; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="54.144" y="108.485813" transform="rotate(-0 54.144 108.485813)">Minecraft videos</text>
   </g>
   <g id="text_4">
    <text style="fill: #152a40; font: 12px 'DejaVu Sans'" transform="translate(54.144 132.238125)">8 worlds · 2 routes each</text>
    <text style="fill: #152a40; font: 12px 'DejaVu Sans'" transform="translate(54.144 148.410937)">188 endpoint-labeled clips</text>
   </g>
   <g id="text_5">
    <text style="fill: #152a40; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="307.584" y="108.485813" transform="rotate(-0 307.584 108.485813)">Matched visual inputs</text>
   </g>
   <g id="text_6">
    <text style="fill: #152a40; font: 11.5px 'DejaVu Sans'" transform="translate(307.584 131.858203)">16-frame video</text>
    <text style="fill: #152a40; font: 11.5px 'DejaVu Sans'" transform="translate(307.584 147.357148)">16 × repeated endpoint frame</text>
   </g>
   <g id="text_7">
    <text style="fill: #152a40; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="578.304" y="108.485813" transform="rotate(-0 578.304 108.485813)">Frozen V-JEPA 2 ViT-L</text>
   </g>
   <g id="text_8">
    <text style="fill: #152a40; font: 10.7px 'DejaVu Sans'" transform="translate(578.304 131.250328)">Official preprocessing + HUD mask</text>
    <text style="fill: #152a40; font: 10.7px 'DejaVu Sans'" transform="translate(578.304 145.671086)">Evaluation mode · no weight updates</text>
   </g>
   <g id="text_9">
    <text style="fill: #152a40; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="854.784" y="108.485813" transform="rotate(-0 854.784 108.485813)">Native feature readout</text>
   </g>
   <g id="text_10">
    <text style="fill: #152a40; font: 11.3px 'DejaVu Sans'" transform="translate(854.784 131.706234)">Blocks 4 / 12 / 24 · 1,024 channels</text>
    <text style="fill: #152a40; font: 11.3px 'DejaVu Sans'" transform="translate(854.784 146.935633)">Spatial mean: final temporal tubelet</text>
   </g>
   <g id="text_11">
    <text style="fill: #53677a; font: 11.5px 'DejaVu Sans'; text-anchor: start" x="40.32" y="201.842203" transform="rotate(-0 40.32 201.842203)">Encoder input: RGB only. Every clip ends at its labeled position; no persistent state between clips.</text>
   </g>
   <g id="text_12">
    <text style="fill: #53677a; font: 11px 'DejaVu Sans'; text-anchor: start" x="282.24" y="216.366281" transform="rotate(-0 282.24 216.366281)">Train-route centering + one scalar RMS scale; no per-channel whitening</text>
   </g>
   <g id="text_13">
    <text style="fill: #ae6308; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="299.52" y="278.574281" transform="rotate(-0 299.52 278.574281)">TRAINABLE READOUTS  ·  positions supervise these probes only</text>
   </g>
   <g id="text_14">
    <text style="fill: #152a40; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="54.144" y="319.085812" transform="rotate(-0 54.144 319.085812)">Training-route pose</text>
   </g>
   <g id="text_15">
    <text style="fill: #152a40; font: 10.5px 'DejaVu Sans'" transform="translate(54.144 341.698359)">Ground-plane X,Z</text>
    <text style="fill: #152a40; font: 10.5px 'DejaVu Sans'" transform="translate(54.144 355.84957)">Coordinates and pair distances</text>
    <text style="fill: #152a40; font: 10.5px 'DejaVu Sans'" transform="translate(54.144 370.000781)">Never an encoder input</text>
   </g>
   <g id="text_16">
    <text style="fill: #152a40; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="313.344" y="315.845813" transform="rotate(-0 313.344 315.845813)">1  Coordinate probe</text>
   </g>
   <g id="text_17">
    <!-- $\hat{p}=hW+b$ -->
    <g style="fill: #152a40" transform="translate(313.344 341.175)">
     <text>
      <tspan style="font: 11.5px 'DejaVu Sans'" x="7.496826 9.540283 42.316406" y="-2.40625 -0.96875 -0.96875">̂=+</tspan>
      <tspan style="font: oblique 11.5px 'DejaVu Sans'" x="0 21.416504 28.705078 54.192627" y="-0.96875">phWb</tspan>
     </text>
    </g>
    <text style="fill: #152a40; font: 11.5px 'DejaVu Sans'" transform="translate(313.344 356.697305)">Ridge regression · 2 outputs</text>
    <text style="fill: #152a40; font: 11.5px 'DejaVu Sans'" transform="translate(313.344 372.19625)">Predict X,Z; derive distances</text>
    <text style="fill: #152a40; font: 11.5px 'DejaVu Sans'" transform="translate(313.344 387.695195)">Fixed regularization</text>
   </g>
   <g id="text_18">
    <text style="fill: #152a40; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="592.128" y="315.845813" transform="rotate(-0 592.128 315.845813)">2  Orthonormal subspace</text>
   </g>
   <g id="text_19">
    <!-- $\hat{d}_{ij}=s\,\|(h_i-h_j)Q\|_2$ -->
    <g style="fill: #152a40" transform="translate(592.128 343.475)">
     <text>
      <tspan style="font: 11.5px 'DejaVu Sans'" x="7.496826 14.456348 34.191126 39.941126 56.521424 78.250892 91.789222" y="-4.40625 -0.5625 -0.5625 -0.5625 -0.5625 -0.5625 -0.5625">̂=‖(−)‖</tspan>
      <tspan style="font: oblique 11.5px 'DejaVu Sans'" x="0 26.332568 44.427698 68.397645 82.737464" y="-0.5625">dshhQ</tspan>
      <tspan style="font: oblique 8.05px 'DejaVu Sans'" x="7.414648 9.651196 51.716273 75.686219" y="1.40625">ijij</tspan>
      <tspan style="font: 8.05px 'DejaVu Sans'" x="97.654066" y="1.40625">2</tspan>
     </text>
    </g>
    <!-- $Q^\top Q=I_k$ · learned scale s -->
    <g style="fill: #152a40" transform="translate(592.128 361.565039)">
     <text>
      <tspan style="font: oblique 11.5px 'DejaVu Sans'" x="0 17.25625 40.424707" y="-0.5218750000000014">QQI</tspan>
      <tspan style="font: 8.05px 'DejaVu Sans'" x="9.91582" y="-5.115625000000001">⊤</tspan>
      <tspan style="font: 11.5px 'DejaVu Sans'" x="28.548486 48.806201 52.461719 56.117236 59.772754 62.967822 70.043018 77.090137 81.818164 89.106738 96.181934 103.481738 107.137256 113.128711 119.451465 126.498584 129.693652 136.768848 140.424365" y="-0.5218750000000014">= · learned scale s</tspan>
      <tspan style="font: oblique 8.05px 'DejaVu Sans'" x="43.816309" y="1.4468749999999986">k</tspan>
     </text>
    </g>
    <text style="fill: #152a40; font: 11.5px 'DejaVu Sans'" transform="translate(592.128 377.063984)">Ranks k = 2, 8</text>
    <text style="fill: #152a40; font: 11.5px 'DejaVu Sans'" transform="translate(592.128 392.56293)">Distance supervision</text>
   </g>
   <g id="text_20">
    <text style="fill: #152a40; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="870.912" y="315.845813" transform="rotate(-0 870.912 315.845813)">3  Linear metric</text>
   </g>
   <g id="text_21">
    <!-- $\hat{d}_{ij}=\|(h_i-h_j)W\|_2$ -->
    <g style="fill: #152a40" transform="translate(870.912 342.684)">
     <text>
      <tspan style="font: 10.8px 'DejaVu Sans'" x="7.065308 13.505518 24.607202 29.982202 45.475232 65.781616 80.604858" y="-4.203125 -0.6500000000000004 -0.6500000000000004 -0.6500000000000004 -0.6500000000000004 -0.6500000000000004 -0.6500000000000004">̂=‖(−)‖</tspan>
      <tspan style="font: oblique 10.8px 'DejaVu Sans'" x="0 34.176172 56.576917 69.975586" y="-0.6500000000000004">dhhW</tspan>
      <tspan style="font: oblique 7.56px 'DejaVu Sans'" x="6.929004 9.01969 40.989404 63.390149" y="1.1546874999999996">ijij</tspan>
      <tspan style="font: 7.56px 'DejaVu Sans'" x="86.085132" y="1.1546874999999996">2</tspan>
     </text>
    </g>
    <text style="fill: #152a40; font: 10.8px 'DejaVu Sans'" transform="translate(870.912 358.341469)">General linear projection</text>
    <text style="fill: #152a40; font: 10.8px 'DejaVu Sans'" transform="translate(870.912 372.897)">Ranks k = 2, 8</text>
    <text style="fill: #152a40; font: 10.8px 'DejaVu Sans'" transform="translate(870.912 387.452531)">Distance loss + regularization</text>
   </g>
   <g id="text_22">
    <text style="fill: #53677a; font: 10.5px 'DejaVu Sans'" transform="translate(40.32 448.618359)">h = normalized frozen feature</text>
    <text style="fill: #53677a; font: 10.5px 'DejaVu Sans'" transform="translate(40.32 462.76957)">p = ground-plane position</text>
    <text style="fill: #53677a; font: 10.5px 'DejaVu Sans'" transform="translate(40.32 476.920781)">Only readouts are fitted</text>
   </g>
   <g id="text_23">
    <text style="fill: #152a40; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="54.144" y="513.485813" transform="rotate(-0 54.144 513.485813)">Within each world: fit route 0 → test route 1; then reverse</text>
   </g>
   <g id="text_24">
    <text style="fill: #152a40; font: 11.7px 'DejaVu Sans'" transform="translate(54.144 537.061359)">Primary: distance MAE between two held-out endpoints   |   Secondary: cross-route retrieval + coordinate error</text>
    <text style="fill: #152a40; font: 11.7px 'DejaVu Sans'" transform="translate(54.144 553.155258)">Same settings for all worlds and layers · Report heading/coverage confounds · Test poses used only for scoring</text>
   </g>
   <g id="text_25">
