[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-binding"
version = "0.1.0"
description = "Controlled Minecraft visual binding experiment backbone"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24,<3", "Pillow>=10", "jsonschema>=4.18"]

[project.optional-dependencies]
model = ["torch>=2.2", "transformers==4.55.0", "accelerate>=0.30", "bitsandbytes>=0.43; platform_system == 'Linux'"]
test = ["pytest>=7"]

[project.scripts]
mc-binding = "mc_binding.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
mc_binding = ["schemas/*.json"]
